apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
spec:
  # Two copies of Bookshelf can't share one database, so the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bookshelf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bookshelf.podLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # No runAsUser: the image starts as root to chown /config, then drops to PUID and PGID.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bookshelf
          image: "ghcr.io/pennydreadful/bookshelf:{{ .Values.image.tag | default .Chart.AppVersion }}"
          env:
            - name: PUID
              value: {{ .Values.puid | quote }}
            - name: PGID
              value: {{ .Values.pgid | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            # Its default is still Readarr, the project it was forked from.
            - name: READARR__APP__INSTANCENAME
              value: Bookshelf
            - name: READARR__AUTH__APIKEY
              valueFrom:
                {{- include "bookshelf.secretKeyRef" (list "apiKey" .Values.apiKey) | nindent 16 }}
            - name: READARR__AUTH__METHOD
              value: Forms
            # Behind a gateway or ingress every request comes from a private address,
            # so DisabledForLocalAddresses would turn the login off for everyone.
            - name: READARR__AUTH__REQUIRED
              value: Enabled
            - name: READARR__POSTGRES__HOST
              value: {{ required "postgres.host is required" .Values.postgres.host | quote }}
            - name: READARR__POSTGRES__PORT
              value: {{ .Values.postgres.port | quote }}
            - name: READARR__POSTGRES__MAINDB
              value: {{ .Values.postgres.databases.main | quote }}
            - name: READARR__POSTGRES__LOGDB
              value: {{ .Values.postgres.databases.log | quote }}
            - name: READARR__POSTGRES__CACHEDB
              value: {{ .Values.postgres.databases.cache | quote }}
            - name: READARR__POSTGRES__USER
              valueFrom:
                {{- include "bookshelf.secretKeyRef" (list "postgres.username" .Values.postgres.username) | nindent 16 }}
            - name: READARR__POSTGRES__PASSWORD
              valueFrom:
                {{- include "bookshelf.secretKeyRef" (list "postgres.password" .Values.postgres.password) | nindent 16 }}
          ports:
            - name: http
              containerPort: 8787
          # The first start creates Bookshelf's schema in Postgres, so start-up gets 5 minutes.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "bookshelf.claimName" (list . "config") }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "bookshelf.claimName" (list . "data") }}
